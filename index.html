<!DOCTYPE html>
<html lang="tr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sitemiz Yapım Aşamasındadır — Antepli Veysel Usta</title>
    <meta
      name="description"
      content="Antepli Veysel Usta — Sitemiz Yapım Aşamasındadır"
    />
    <meta name="theme-color" content="#f6f0e6" />
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        padding: 0;
      }

      body {
        min-height: 100vh;
        min-height: 100dvh;
        display: flex;
        align-items: center;
        justify-content: center;
        background-color: #f6f0e6;
        background-image:
          radial-gradient(ellipse at 50% 40%, rgba(215, 196, 160, 0.28) 0%, rgba(246, 240, 230, 0) 70%),
          radial-gradient(circle at 10% 90%, rgba(154, 63, 40, 0.04) 0%, transparent 50%),
          #f6f0e6;
        color: #2c1c12;
        font-family: "Cormorant Garamond", Palatino, "Palatino Linotype", Georgia, serif;
        text-align: center;
        padding: 2rem 1.5rem;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        overflow: hidden;
      }

      h1 {
        font-size: clamp(2.4rem, 6vw, 4.2rem);
        font-weight: 600;
        line-height: 1.15;
        letter-spacing: -0.02em;
        color: #2c1c12;
      }
    </style>
  </head>
  <body>
    <h1>Sitemiz Yapım Aşamasındadır</h1>
  </body>
</html>
