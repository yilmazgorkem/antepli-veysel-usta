<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <defs>
    <radialGradient id="sealBg" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#4a3420"/>
      <stop offset="100%" stop-color="#22140a"/>
    </radialGradient>
    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#eddab6"/>
      <stop offset="50%" stop-color="#c49d56"/>
      <stop offset="100%" stop-color="#8c672b"/>
    </linearGradient>
  </defs>

  <!-- Base Medallion -->
  <circle cx="32" cy="32" r="29" fill="url(#sealBg)"/>
  
  <!-- Outer Gold Rim -->
  <circle cx="32" cy="32" r="29" stroke="url(#goldGradient)" stroke-width="1.8"/>
  
  <!-- Secondary Inner Rings -->
  <circle cx="32" cy="32" r="25.5" stroke="#dfcaa6" stroke-width="0.8" stroke-dasharray="1.8 1.8" opacity="0.6"/>
  <circle cx="32" cy="32" r="23" stroke="url(#goldGradient)" stroke-width="0.5" opacity="0.45"/>

  <!-- Left Wheat Stalk Motif -->
  <path d="M19 41 C17.2 35.5 17 28 21.5 20.5" stroke="#dfcaa6" stroke-width="1.1" stroke-linecap="round" fill="none" opacity="0.75"/>
  <path d="M17.5 37 C19.2 36.5 20.2 35 19.8 32.8" stroke="#dfcaa6" stroke-width="1.2" stroke-linecap="round" fill="none" opacity="0.85"/>
  <path d="M16.5 31.5 C18.2 31 19.2 29.2 18.8 27.2" stroke="#dfcaa6" stroke-width="1.2" stroke-linecap="round" fill="none" opacity="0.85"/>
  <path d="M17.8 26 C19.5 25 20.5 23.2 19.8 21.2" stroke="#dfcaa6" stroke-width="1.2" stroke-linecap="round" fill="none" opacity="0.85"/>

  <!-- Right Wheat Stalk Motif -->
  <path d="M45 41 C46.8 35.5 47 28 42.5 20.5" stroke="#dfcaa6" stroke-width="1.1" stroke-linecap="round" fill="none" opacity="0.75"/>
  <path d="M46.5 37 C44.8 36.5 43.8 35 44.2 32.8" stroke="#dfcaa6" stroke-width="1.2" stroke-linecap="round" fill="none" opacity="0.85"/>
  <path d="M47.5 31.5 C45.8 31 44.8 29.2 45.2 27.2" stroke="#dfcaa6" stroke-width="1.2" stroke-linecap="round" fill="none" opacity="0.85"/>
  <path d="M46.2 26 C44.5 25 43.5 23.2 44.2 21.2" stroke="#dfcaa6" stroke-width="1.2" stroke-linecap="round" fill="none" opacity="0.85"/>

  <!-- Top Star Accent -->
  <path d="M32 9 L32.7 11.4 L35.1 12.2 L32.7 13 L32 15.4 L31.3 13 L28.9 12.2 L31.3 11.4 Z" fill="#eddab6"/>

  <!-- Monogram VU (Veysel Usta) -->
  <text x="32" y="38" text-anchor="middle" font-family="'Cormorant Garamond', Georgia, serif" font-size="20" font-weight="700" fill="#fcf9f2" letter-spacing="1">VU</text>

  <!-- Bottom Accent Dots -->
  <circle cx="28" cy="48.5" r="1.1" fill="#dfcaa6" opacity="0.75"/>
  <circle cx="32" cy="49.5" r="1.4" fill="#dfcaa6"/>
  <circle cx="36" cy="48.5" r="1.1" fill="#dfcaa6" opacity="0.75"/>
</svg>
